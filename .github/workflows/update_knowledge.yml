name: Update knowledge.json

on:
  schedule:
    - cron: '10 18 * * *'  # 毎日03:10 JST（UTC 18:10）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatbot-data-update
  cancel-in-progress: false

jobs:
  update-knowledge:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 📦 リポジトリをチェックアウト
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: 🐍 Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🔧 必要なパッケージをインストール
        run: pip install gspread oauth2client numpy openai faiss-cpu python-dotenv

      - name: 🔐 credentials.json を書き出し
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: 🧑‍💻 Git ユーザー設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config fetch.prune true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 🧠 最新mainからknowledge.jsonを生成・コミット・プッシュ
        id: update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: sync with origin/main and regenerate knowledge.json..."
            git fetch origin main
            git reset --hard origin/main

            if ! python scripts/generate_knowledge.py; then
              echo "Generation attempt $i failed."
              sleep $((i*20))
              continue
            fi

            if git diff --quiet -- data/knowledge.json; then
              echo "No changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add data/knowledge.json
            git commit -m "📘 Auto update knowledge.json"

            if git push origin HEAD:main; then
              echo "Push success."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push attempt $i was rejected. Regenerating from the latest main."
            sleep $((i*5))
          done

          echo "Update failed after three attempts."
          exit 1

      - name: 🧹 後始末（credentials.json 削除）
        if: always()
        run: rm -f credentials.json
