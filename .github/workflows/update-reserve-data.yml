name: Update reserve FAQ, Knowledge and FAISS

on:
  schedule:
    - cron: '20 18 * * *'  # 毎日03:20 JST（UTC 18:20）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reserve-data-update
  cancel-in-progress: false

jobs:
  update-reserve-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 📦 リポジトリをチェックアウト
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: 🐍 Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🔧 必要なパッケージをインストール
        run: |
          pip install -r requirements.txt
          pip install gspread oauth2client faiss-cpu python-dotenv

      - name: 🔐 credentials.json を書き出し
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: 🧑‍💻 Git ユーザー設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config fetch.prune true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 🧠 最新mainからreserveデータ全体を生成・コミット・プッシュ
        id: update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FAQ_RANGE: 'reserve_faq!A1:C'
          KNOWLEDGE_SHEET: 'reserve_knowledge'
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: sync with origin/main and regenerate all reserve artifacts..."
            git fetch origin main
            git reset --hard origin/main

            if ! python update_reserve_faq_and_rebuild.py || \
               ! python scripts/generate_reserve_knowledge.py || \
               ! python rebuild_reserve_index.py; then
              echo "Generation attempt $i failed."
              sleep $((i*20))
              continue
            fi

            if git diff --quiet -- \
              data/reserve_faq.json \
              data/reserve_knowledge.json \
              data/reserve_vector_data.npy \
              data/reserve_index.faiss; then
              echo "No changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add \
              data/reserve_faq.json \
              data/reserve_knowledge.json \
              data/reserve_vector_data.npy \
              data/reserve_index.faiss
            git commit -m "📘 Update reserve FAQ, Knowledge and FAISS [skip ci]"

            if git push origin HEAD:main; then
              echo "Push success."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push attempt $i was rejected. Discarding generated artifacts before retry."
            sleep $((i*5))
          done

          echo "Update failed after regenerating from the latest main three times."
          exit 1

      - name: 🧹 後始末（credentials.json 削除）
        if: always()
        run: rm -f credentials.json

      - name: 🚀 Render に自動デプロイ
        if: steps.update.outputs.changed == 'true'
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
